# CurveScout upload and hosting (r70, 21 Nov 2026). Replaces the three "CurveScout autopilot" copies.
# - Your upload (a zip on the repository's upload page) is unpacked and published exactly as before.
# - No run every 15 minutes any more: it runs on an upload, every 6 hours as a safety net, or by hand.
# - The pass status is read every 6 hours here, until the Cloudflare scheduled job takes over (the file
#   cloudflare/serving, shipped in the domain-switch release, turns this step off - no setting to change).
# - One job per run (each job costs at least one GitHub minute once the repository is private).
# - Cloudflare: when the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist, the finished
#   public folder (no scripts, no build data) is uploaded to Cloudflare as well. Without them that step is skipped
#   and GitHub Pages keeps serving. Nothing here touches the domain.
# - The old autopilot copies are switched off (not deleted), once, on the first run.
name: CurveScout upload
on:
  schedule:
    - cron: '41 */6 * * *'
  push:
    paths: [ 'inbox/**', '*.zip', '*.ZIP', '.github/workflows/cs-upload.yml' ]
  workflow_dispatch: {}
permissions: { contents: write, actions: write }
concurrency: { group: cs-deploy, cancel-in-progress: false }
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: "${{ github.token }}"
      R: "${{ github.repository }}"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      W: npx --yes wrangler@4.155.0
    steps:
      - name: Switch off the old autopilot copies (each ran every 15 minutes)
        continue-on-error: true
        run: |
          for W in "cs-autopilot.yml" "cs-autopilot (1).yml" "cs-autopilot (2).yml"; do
            S=$(gh api "repos/$R/actions/workflows/$(printf '%s' "$W" | jq -sRr @uri)" --jq .state 2>/dev/null || echo missing)
            if [ "$S" = "active" ]; then gh api -X PUT "repos/$R/actions/workflows/$(printf '%s' "$W" | jq -sRr @uri)/disable" && echo "switched off: $W" || echo "could not switch off $W (next run tries again)"; else echo "$W: $S"; fi
          done
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Find zips (inbox and releases)
        run: |
          mkdir -p /tmp/in /tmp/st; : > /tmp/st/log
          note() { echo "$*" | tee -a /tmp/st/log; }
          # A. inbox
          for z in inbox/*.zip inbox/*.ZIP ./*.zip ./*.ZIP; do [ -f "$z" ] || continue; cp "$z" /tmp/in/; note "upload: $(basename "$z") $(stat -c%s "$z") bytes"; echo "$z" >> /tmp/st/uploads; rm -f "$z"; done
          # B. releases (drafts included), newest first; only finished uploads
          gh api "repos/$R/releases?per_page=30" > /tmp/st/rel.json || echo '[]' > /tmp/st/rel.json
          jq -r '.[] | select((.tag_name // .name // "") | test("^deploy-")) | [(.id|tostring), (.tag_name // .name), (.draft|tostring), ([.assets[] | select(.state=="uploaded" and (.name|test("\\.zip$";"i"))) | .id|tostring] | join(",")), ([.assets[] | .name + ":" + .state] | join(" ")), .created_at] | join("|")' /tmp/st/rel.json > /tmp/st/rel.tsv || true
          while IFS='|' read -r ID TAG DRAFT AIDS ALL CREATED; do
            [ -n "$ID" ] || continue
            if [ -z "$AIDS" ]; then
              AGE=$(( $(date +%s) - $(date -d "$CREATED" +%s 2>/dev/null || date +%s) ))
              if [ "$AGE" -gt 3600 ]; then gh api -X DELETE "repos/$R/releases/$ID" >/dev/null 2>&1; git push -q origin ":refs/tags/$TAG" 2>/dev/null || true; note "release $TAG removed: no finished zip after 1 hour [$ALL] - upload the zip again"; fi
              continue; fi
            for A in ${AIDS//,/ }; do
              NAME=$(jq -r --arg a "$A" '.[] | .assets[] | select((.id|tostring)==$a) | .name' /tmp/st/rel.json | head -1)
              gh api -H 'Accept: application/octet-stream' "repos/$R/releases/assets/$A" > "/tmp/in/$TAG--$NAME" && note "release $TAG: $NAME downloaded"
            done
            echo "$ID $TAG" >> /tmp/st/used-releases
          done < /tmp/st/rel.tsv
          # road-job drafts: publish them and start the road job once
          jq -r '.[] | select(.draft and ((.tag_name // .name // "") | test("^roads-"))) | [(.id|tostring), (.tag_name // .name)] | join("|")' /tmp/st/rel.json | while IFS='|' read -r ID TAG; do
            gh api -X PATCH "repos/$R/releases/$ID" -f tag_name="$TAG" -f target_commitish=main -F draft=false >/dev/null && note "road release $TAG published" && gh workflow run cs-roads.yml --ref main && note "road job started"; done
          ls -la /tmp/in
      - name: Deploy a site zip
        run: |
          note() { echo "$*" | tee -a /tmp/st/log; }
          # inbox zips first (all of them, in name order: a big release may come as part-1, part-2 ...), else the newest release zip
          INB=$(ls /tmp/in/*.zip 2>/dev/null | grep -v -- '--' | grep -iv roads | sort || true)
          if [ -n "$INB" ]; then SITES="$INB"; else SITES=$(ls -t /tmp/in/*--*.zip 2>/dev/null | grep -iv roads | head -1 || true); fi
          [ -n "$SITES" ] || { note "no site zip"; exit 0; }
          while IFS= read -r Z; do unzip -tq "$Z" || { note "STOP: $(basename "$Z") is damaged (upload not finished?) - upload it again"; echo bad > /tmp/st/failed; exit 0; }; done <<< "$SITES"
          while IFS= read -r Z; do unzip -oq "$Z" -d .; done <<< "$SITES"
          SITE=$(echo "$SITES" | xargs -d '\n' -n1 basename | paste -sd+ -)
          S=$(du -sm --apparent-size --exclude=.git --exclude=inbox . | cut -f1)
          BIG=$(find . -path ./.git -prune -o -path ./inbox -prune -o -type f -size +10M -print | head -1)
          if [ "$S" -ge 950 ] || [ -n "$BIG" ] || ! { test -s index.html && test -s app.js && test -s sw.js; }; then
            note "STOP: limits (site $S MB, big file: ${BIG:-none}) - nothing deployed"; git checkout -- . ; git clean -fdq -e inbox; while read -r z; do rm -f "$z"; done < /tmp/st/uploads 2>/dev/null || true; echo bad > /tmp/st/failed; exit 0; fi
          REL=$(grep -m1 "^const V" sw.js | grep -o "curvescout-app-[a-z0-9.-]*" || echo "new version")
          note "deployed $SITE -> $REL, site $S MB"; echo "$REL" > /tmp/st/deployed
      - name: Road-job zip -> newest roads- release, start the road job
        run: |
          note() { echo "$*" | tee -a /tmp/st/log; }
          RZ=$(ls /tmp/in/*.zip 2>/dev/null | grep -v -- '--' | grep -i roads | head -1 || true)
          [ -n "$RZ" ] || exit 0
          unzip -tq "$RZ" || { note "STOP: road zip $(basename "$RZ") is damaged - upload it again"; exit 0; }
          T="roads-$(date -u +%Y%m%d%H%M)"; cp "$RZ" /tmp/st/road.zip
          gh release create "$T" /tmp/st/road.zip --title "$T" --notes "road job (autopilot)" --target main && note "road zip -> release $T" && gh workflow run cs-roads.yml --ref main && note "road job started"
      - name: Commit once (site, inbox clean-up, status) and tidy releases
        run: |
          git config user.name "curvescout-autopilot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -s /tmp/st/log ] || exit 0
          grep -qv '^no site zip$' /tmp/st/log || { echo "nothing found"; exit 0; }
          git rm -rq --cached inbox 2>/dev/null || true; rm -rf inbox
          for z in ./*.zip ./*.ZIP; do [ -f "$z" ] || continue; git rm -q --cached "$z" 2>/dev/null || true; rm -f "$z"; done
          OLD=$(jq -c .log ops/autopilot-status.json 2>/dev/null || echo null); NEW=$(jq -Rnc '[inputs]' < /tmp/st/log)
          if [ "$OLD" != "$NEW" ] || [ -f /tmp/st/deployed ]; then mkdir -p ops; jq -Rn --arg at "$(date -u +%FT%TZ)" --arg run "${{ github.run_id }}" '{at:$at, run:$run, log:[inputs]}' < /tmp/st/log > ops/autopilot-status.json; fi
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          MSG="Autopilot: $(cat /tmp/st/deployed 2>/dev/null || echo status)"
          git commit -qm "$MSG" && git push -q origin HEAD:main || { git pull -q --rebase && git push -q origin HEAD:main; }
          gh api -X POST "repos/$R/pages/builds" >/dev/null 2>&1 || true
          if [ -f /tmp/st/deployed ] && [ -f /tmp/st/used-releases ]; then while read -r ID TAG; do case "$TAG" in deploy-*) gh release delete "$TAG" --yes --cleanup-tag || gh api -X DELETE "repos/$R/releases/$ID" || true;; esac; done < /tmp/st/used-releases; fi
      - uses: actions/setup-node@v4
        if: always()
        with: { node-version: 22 }
      - name: Read the open pass feed (until Cloudflare serves it)
        id: pass
        if: always()
        run: |
          git pull -q --rebase origin main || true
          [ -f cloudflare/serving ] && { echo "Cloudflare reads the pass feed now: nothing to do here"; exit 0; }
          [ -f .github/scripts/pass-status.mjs ] || { echo "pass script not deployed yet"; exit 0; }
          node .github/scripts/pass-status.mjs
      - name: Commit when a pass status changed
        if: always()
        run: |
          git config user.name "curvescout-passes"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/live/passes.json ] || exit 0
          git add data/live/passes.json; git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "Pass status update" && { git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; }; }
      - name: Cloudflare set up?
        id: cf
        if: always()
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "on=yes" >> "$GITHUB_OUTPUT"; else echo "Cloudflare secrets not set: skipped, GitHub Pages keeps serving"; fi
      - name: Anything new since the last Cloudflare upload?
        if: always() && steps.cf.outputs.on == 'yes'
        id: new
        run: |
          git pull -q --rebase origin main || true
          git fetch -q -f origin "refs/tags/cf-deployed:refs/tags/cf-deployed" 2>/dev/null || true
          if [ "$(git rev-parse -q --verify cf-deployed^{commit} 2>/dev/null)" = "$(git rev-parse HEAD)" ] && [ "${{ github.event_name }}" = schedule ]; then echo "already on Cloudflare"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Public folder, limits and private-file check
        id: gate
        if: always() && steps.new.outputs.go == 'yes'
        run: node .github/scripts/cf-public.mjs _public
      - name: Pass-status store (created once)
        id: kv
        if: always() && steps.gate.outcome == 'success'
        working-directory: cloudflare
        run: |
          find_id() { $W kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s).find(n=>/curvescout-live/.test(n.title));process.stdout.write(x?x.id:"")}catch(_){}})'; }
          ID=$(find_id); if [ -z "$ID" ]; then $W kv namespace create curvescout-live >/dev/null; ID=$(find_id); fi
          test -n "$ID" || { echo "could not create the pass-status store"; exit 1; }
          sed -i "s/__KV_ID__/$ID/g" wrangler.jsonc
      - name: Upload the site (production Worker, no public address until the domain switch)
        id: prod
        if: always() && steps.kv.outcome == 'success'
        working-directory: cloudflare
        run: $W deploy --env="" --message "$(git rev-parse --short HEAD)"
      - name: Upload the preview copy (noindex on every page)
        id: prev
        if: always() && steps.prod.outcome == 'success'
        run: |
          node .github/scripts/cf-public.mjs _public --preview
          cd cloudflare && $W deploy --env preview --message "$(git rev-parse --short HEAD)"
      - name: Remember what is on Cloudflare
        if: always() && steps.prev.outcome == 'success'
        run: git tag -f cf-deployed HEAD && git push -qf origin refs/tags/cf-deployed
